# config/ekf_local.yaml
ekf_local_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true          # planar robot, ignore roll/pitch/z
    publish_tf: true

    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom         # local EKF lives in odom frame

    # IMU — provides orientation + angular velocity + linear acceleration
    imu0: /imu/data
    imu0_config: [false, false, false,   # x, y, z position
                  true,  true,  true,    # roll, pitch, yaw
                  false, false, false,   # vx, vy, vz
                  true,  true,  true,    # vroll, vpitch, vyaw
                  true,  true,  true]    # ax, ay, az
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    # Visual odometry from OAK-D (depthai-ros publishes this)
    odom0: /stereo_inertial_odometry
    odom0_config: [true,  true,  false,  # x, y, z
                   false, false, true,   # roll, pitch, yaw
                   true,  true,  false,  # vx, vy, vz
                   false, false, true,   # vroll, vpitch, vyaw
                   false, false, false]  # ax, ay, az
    odom0_differential: false